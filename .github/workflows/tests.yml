name: Tests

on: [workflow_call]

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  xcodebuild:
    name: Xcodebuild
    runs-on: macos-latest
    env:
      IOS_DEVICE: iPhone 17 Pro
      WATCHOS_DEVICE: Apple Watch Ultra 3 (49mm)
      TVOS_DEVICE: Apple TV 4K (3rd generation)
    steps:
      - uses: actions/checkout@v4
      - name: Ensure simulators exist
        run: |
          # Runner images sometimes come up with no simulator devices, create the ones we need on the latest installed runtime
          ensure_simulator() {
            local name="$1" platform="$2"
            if xcrun simctl list devices available -j | jq -e --arg name "$name" '[.devices[][] | select(.name == $name)] | length > 0' > /dev/null; then
              echo "Simulator '$name' already exists"
              return
            fi
            local runtime devicetype
            runtime=$(xcrun simctl list runtimes available -j | jq -r --arg platform "$platform" '[.runtimes[] | select(.platform == $platform)] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
            devicetype=$(xcrun simctl list devicetypes -j | jq -r --arg name "$name" '.devicetypes[] | select(.name == $name) | .identifier')
            if [ -z "$runtime" ] || [ -z "$devicetype" ]; then
              echo "::error::Cannot create '$name' (runtime: '${runtime:-none}', device type: '${devicetype:-none}')"
              return 1
            fi
            echo "Creating simulator '$name' ($devicetype) on $runtime"
            xcrun simctl create "$name" "$devicetype" "$runtime"
          }
          ensure_simulator "$IOS_DEVICE" iOS
          ensure_simulator "$WATCHOS_DEVICE" watchOS
          ensure_simulator "$TVOS_DEVICE" tvOS
      - name: iOS tests
        run: set -o pipefail && xcodebuild test -scheme ACKategories -resultBundlePath Tests-iOS.xcresult -sdk iphonesimulator -destination "platform=iOS Simulator,name=$IOS_DEVICE,OS=latest" ONLY_ACTIVE_ARCH=YES | xcpretty
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Tests-iOS.xcresult
          path: Tests-iOS.xcresult
      - name: iOS responder tests
        run: set -o pipefail && xcodebuild test -scheme ACKategories -resultBundlePath Tests-iOS-Responder.xcresult -sdk iphonesimulator -destination "platform=iOS Simulator,name=$IOS_DEVICE,OS=latest" ONLY_ACTIVE_ARCH=YES | xcpretty
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Tests-iOS-Responder.xcresult
          path: Tests-iOS-Responder.xcresult
      - name: macOS tests
        run: set -o pipefail && xcodebuild test -scheme ACKategories -resultBundlePath Tests-macOS.xcresult -destination 'platform=OS X,arch=x86_64' | xcpretty
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Tests-macOS.xcresult
          path: Tests-macOS.xcresult
      - name: watchOS tests
        run: set -o pipefail && xcodebuild test -scheme ACKategories -resultBundlePath Tests-watchOS.xcresult -sdk watchsimulator -destination "platform=watchOS Simulator,name=$WATCHOS_DEVICE,OS=latest" ONLY_ACTIVE_ARCH=YES | xcpretty
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Tests-watchOS.xcresult
          path: Tests-watchOS.xcresult
      - name: tvOS tests
        run: set -o pipefail && xcodebuild test -scheme ACKategories -resultBundlePath Tests-tvOS.xcresult -sdk appletvsimulator -destination "platform=tvOS Simulator,name=$TVOS_DEVICE,OS=latest" ONLY_ACTIVE_ARCH=YES | xcpretty
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Tests-tvOS.xcresult
          path: Tests-tvOS.xcresult
  spm:
    name: SPM
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPM build
        run: swift build
      - name: SPM tests
        run: swift test